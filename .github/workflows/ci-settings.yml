name: CI settings
on:
  pull_request:
    paths:
      - "packages/settings/**"
      - ".github/workflows/ci-settings.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enchere/settings lint
      - run: pnpm --filter @enchere/settings typecheck
      - run: pnpm --filter @enchere/settings test
      - run: pnpm --filter @enchere/settings build
